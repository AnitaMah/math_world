{% load static %}
<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ content.toc_title }}</title>

    <!-- Стилі -->
    <link rel="stylesheet" href="{% static 'education/css/map_ui.css' %}">
</head>
<body>
<div class="page">

    <!-- Заголовок та перемикач мов -->
    <div class="header">
        <div>
            <h1 class="title">{{ content.title }}</h1>
            <p class="lead">{{ content.toc_lead }}</p>
        </div>
        <div class="lang-switch">
            <strong>{{ current_lang_label }}</strong>
            <span>·</span>
            <a href="?{{ toggle_query }}">{{ other_lang_label }}</a>
        </div>
    </div>

    <!-- Обгортка для мапи -->
    <div class="map-wrap">
        <div class="map-controls" style="display: flex; gap: 12px; align-items: center; margin-bottom: 10px;">
            <button id="resetProgressBtn" class="button">Reset progress</button>
            <div id="mapProgressStatus" style="color: var(--muted); font-size: 14px;"></div>
        </div>

        <!-- SVG-карта -->
        <svg id="mapSvg" width="100%" height="800" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid meet"></svg>
    </div>

    <!-- Скрипти -->
    <script src="{% static 'education/map.js' %}"></script>
    <script>
        const map = {{ map_data|safe }};
        const lang = '{{ lang }}';
    </script>
</div>
</body>
</html>
