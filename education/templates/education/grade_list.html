<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    {% load static %}
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ content.grade_title }}</title>
    <link rel="stylesheet" href="map_ui.css">
</head>
<body>
<div class="page">
    <div class="header">
        <div>
            <h1 class="title">{{ content.grade_title }}</h1>
            <p class="lead">{{ content.grade_lead }}</p>
        </div>
        <div class="lang-switch">
            <strong>{{ current_lang_label }}</strong>
            <span>·</span>
            <a href="?{{ toggle_query }}">{{ other_lang_label }}</a>
        </div>
    </div>
    {% include 'education/_map_partial.html' %}
</div>
</body>
</html>
