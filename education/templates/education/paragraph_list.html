<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ section }} · {{ content.paragraphs }}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'education/paragraph_list.css' %}">
</head>
<body>
    <div class="page">
        <div class="top">
            <div>
                <p class="meta">{{ content.paragraphs }}</p>
                <h1 class="title">{{ section }}</h1>
            </div>
            <div class="lang">
                <strong>{{ current_lang_label }}</strong>
                <span>·</span>
                <a href="?{{ toggle_query }}">{{ other_lang_label }}</a>
            </div>
        </div>

        <div class="list">
            {% for paragraph in paragraphs %}
                <div class="card">
                    <h3>§ {{ paragraph.number }}. {{ paragraph.title }}</h3>
                    <div class="meta">{{ paragraph.items_count }} · {{ content.items }}</div>
                    <a class="button" href="{% url 'item_list' paragraph.id %}?lang={{ lang }}">{{ content.open }} →</a>
                </div>
            {% endfor %}
        </div>

        <a class="back" href="{% url 'section_list' section_id %}?lang={{ lang }}">← {{ content.back }}</a>
    </div>
</body>
</html>
