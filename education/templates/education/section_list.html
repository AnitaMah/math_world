<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    {% load static %}
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ grade }} · {{ content.sections }}</title>
    <link rel="stylesheet" href="map_ui.css">
</head>
<body>
<div class="page">
    <div class="header">
        <div>
            <h1 class="title">{{ grade }}</h1>
            <p class="lead">{{ content.sections }}</p>
        </div>
        <div class="lang-switch">
            <strong>{{ current_lang_label }}</strong>
            <span>·</span>
            <a href="?{{ toggle_query }}">{{ other_lang_label }}</a>
        </div>
    </div>
    {% include 'education/_map_partial.html' %}
    <a class="button back" href="{% url 'grade_list' %}?lang={{ lang }}">← {{ content.back }}</a>
</div>
</body>
</html>
