<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ grade }} · {{ content.sections }}</title>
    <style>
        :root {
            --bg: #f6f8fb;
            --card: #ffffff;
            --primary: #2563eb;
            --text: #0f172a;
            --muted: #475569;
            --border: #e2e8f0;
        }
        body { margin: 0; font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
        .page { max-width: 1000px; margin: 0 auto; padding: 30px 18px 60px; }
        .top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
        .title { margin: 0; font-size: 24px; }
        .lang { padding: 8px 12px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
        .lang a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-top: 18px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; box-shadow: 0 10px 26px rgba(15,23,42,0.05); }
        .card h3 { margin: 8px 0 4px; font-size: 18px; }
        .card p { margin: 0 0 10px; color: var(--muted); }
        .meta { color: var(--muted); font-size: 14px; }
        .button { display: inline-flex; align-items: center; gap: 6px; padding: 10px 12px; background: linear-gradient(135deg, var(--primary), #1d4ed8); color: #fff; text-decoration: none; border-radius: 12px; font-weight: 700; }
        .back { display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; text-decoration: none; color: var(--primary); font-weight: 600; }
    </style>
</head>
<body>
    <div class="page">
        <div class="top">
            <div>
                <p class="meta">{{ content.sections }}</p>
                <h1 class="title">{{ grade }}</h1>
            </div>
            <div class="lang">
                <strong>{{ current_lang_label }}</strong>
                <span>·</span>
                <a href="?{{ toggle_query }}">{{ other_lang_label }}</a>
            </div>
        </div>

        <div class="grid">
            {% for section in sections %}
                <div class="card">
                    <h3>{{ section.title }}</h3>
                    <p>{{ section.paragraphs_count }} · {{ content.paragraphs }}</p>
                    <a class="button" href="{% url 'paragraph_list' section.id %}?lang={{ lang }}">{{ content.open }} →</a>
                </div>
            {% endfor %}
        </div>

        <a class="back" href="{% url 'grade_list' %}?lang={{ lang }}">← {{ content.back }}</a>
    </div>
</body>
</html>
