<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Щось зламалося · Математичний світ</title>
<!-- Статична сторінка 500 (фаза 16): без шаблонних тегів і зовнішніх файлів — вона має відкритися,
     навіть коли зламані база, шаблони чи статика. Кольори дублюють tokens.css. -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
         background: #0b1220; color: #eef1f6; font: 600 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
  main { max-width: 440px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .code { font: 800 72px/1 system-ui, sans-serif; color: #4dd0e1; margin: 0; }
  h1 { font-size: 26px; margin: 0; }
  p { color: #c6cedb; margin: 0; }
  a { margin-top: 12px; display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 16px;
      background: #4dd0e1; color: #0b1220; font-weight: 800; text-decoration: none; }
  a:focus-visible { outline: 3px solid #ffffff; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <p class="code" aria-hidden="true">500</p>
  <h1>Шторм на сервері</h1>
  <p>Щось зламалося з нашого боку. Ми вже бачимо помилку — спробуй трохи згодом.</p>
  <a href="/">На мапу</a>
</main>
</body>
</html>
