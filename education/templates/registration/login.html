{% extends "registration/_auth_base.html" %}
{% block content %}
<h1>Вхід</h1>
<p class="hint">Прогрес, який ти набрав як гість, перейде в акаунт.</p>
<form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn--primary" type="submit" style="width:100%">Увійти</button>
<input type="hidden" name="next" value="{{ next }}"></form>
<p>Немає акаунта? <a href="{% url 'signup' %}">Зареєструватися</a></p>
{% endblock %}
